name: pms

services:
  db:
    image: postgres:17-alpine
    container_name: pms-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pms
      - POSTGRES_PASSWORD=pms_dev_password
      - POSTGRES_DB=pms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: pms-api
    ports:
      - "4444:4444"
    environment:
      - NODE_ENV=production
      - PORT=4444
      - DATABASE_URL=postgres://pms:pms_dev_password@db:5432/pms
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: pms-client
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  postgres_data:
